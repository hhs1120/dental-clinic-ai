# LLM 게이트웨이 설정 (shared/llm.py) — 생성기·앱 공용. 의미는 docs/치과 AX - 앱 설계.md §7
# 별칭 → 모델 순서. 첫 모델이 기본, 오류(재시도 소진)·거절이면 다음 모델로 폴백
aliases:
  gen: [claude-sonnet-5-5, claude-sonnet-5]        # 생성기 7·9·9b
  classify: [claude-haiku-5-5, claude-sonnet-5-5]  # ① 분류·요약
  chat: [claude-sonnet-5-5, claude-sonnet-5]       # ③ 챗·④ 제안
  rerank: [claude-haiku-5-5]                       # ③ LLM 리랭킹 — 다른 모델로 넘어가면 비교가 섞인다
# 모델별 단가($/1M 토큰). cache_read가 없으면 input의 0.1배. server_fallback: 서버 측 거절 폴백(fallbacks: "default")
models:
  claude-sonnet-5-5: { input: 2.00, output: 10.00, cache_read: 0.20, server_fallback: true }
  claude-sonnet-5: { input: 2.00, output: 10.00, cache_read: 0.20 }
  claude-haiku-5-5: { input: 0.10, output: 0.50 }   # 프롬프트 10만 토큰 이하 단가(넘으면 0.50/2.50 — 분류 입력은 통화 하나라 해당 없음)
# 일일 비용 상한($) — 넘으면 즉시 호출을 하지 않는다(배치 제출은 상한 밖). 금액의 원본은 docs/치과 AX - 기능 정의.md §7 (tests/generator/test_doc_sync.py가 비교)
daily_usd_limit: { generator: 40, runtime: 15 }
