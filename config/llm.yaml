# LLM 게이트웨이 설정 (shared/llm.py) — 생성기·앱 공용. 의미는 docs/치과 AX - 앱 설계.md §7
# 별칭 → 모델 순서. 첫 모델이 기본, 오류(재시도 소진)·거절이면 다음 모델로 폴백
aliases:
  gen: [claude-sonnet-5-5, claude-sonnet-5]        # 생성기 7·9·9b
  gen_hard: [gpt-6.1-sol]                          # 생성기 어려운 통화 녹취 — 분류(Haiku)·라벨(Opus)과 다른 계열, 폴백 없음(어려운 통화 설계 §3.5)
  classify: [claude-haiku-5-5, claude-sonnet-5-5]  # ① 분류기 라벨
  summarize: [claude-haiku-5-5, claude-sonnet-5-5] # ① 분류기 요약·할 일
  judge: [qwen3.5-2b-judge]                        # ① 판정기 라벨 — 로컬 Qwen(--group finetune), 폴백 없음. 옛 판정기 버전(v1·v2 Solar)은 다시 돌리지 않는다(Qwen 판정기 설계 "비교 규칙")
  chat: [claude-sonnet-5-5, claude-sonnet-5]       # ③ 챗·④ 제안·⑤-2 점검
  followup: [claude-sonnet-5-5]                    # ① 후속 에이전트(backend/followup.py) — 앱 설계 §7 그 밖의 에이전트
  recon: [claude-sonnet-5-5]                       # ⑧-1 조사 에이전트(backend/recon_agent.py) — 폴백 없음(짝 비교가 섞이지 않게)
  expense: [claude-sonnet-5-5]                     # ⑧-2 증빙 탐색 에이전트(backend/expense_agent.py) — 폴백 없음(짝 비교가 섞이지 않게)
  blind_judge: [claude-haiku-5-5]                  # ② 블라인드 LLM 쌍 비교(평가 설계 §2.4) — 요약을 쓴 모델과 같아 자기 글 쏠림은 사람 투표 일치율로 본다
  rerank: [claude-haiku-5-5]                       # ③ LLM 리랭킹 — 다른 모델로 넘어가면 비교가 섞인다
  gold_audit: [claude-opus-5-5]                    # 골드 점검 중재(평가 설계 §2.3) — 생성기(Sonnet)·판정기(Qwen)와 다른 모델, 폴백 없음(섞이면 중재가 바뀐다)
  hard_label: [claude-opus-5-5]                    # 어려운 통화 Opus 독립 라벨(evaluation/hard_labels.py) — 녹취만 읽음, 폴백 없음
  action_label: [claude-opus-5-5]                  # 처리 정답 라벨(evaluation/call_actions.py) — 후속 에이전트(Sonnet)와 다른 모델, 폴백 없음
# 모델별 단가($/1M 토큰). cache_read가 없으면 input의 0.1배. server_fallback: 서버 측 거절 폴백(fallbacks: "default")
models:
  claude-opus-5-5: { input: 4.00, output: 20.00, cache_read: 0.20 }  # 서버 측 폴백 안 씀 — 골드 점검 중재만
  gpt-6.1-sol: { input: 2.00, output: 10.00, cache_read: 0.10, provider: openai }  # developers.openai.com/api/docs/pricing (2026-11-11) — Batch는 BATCH_PRICE_SHARE
  claude-sonnet-5-5: { input: 2.00, output: 10.00, cache_read: 0.20, server_fallback: true }
  claude-sonnet-5: { input: 2.00, output: 10.00, cache_read: 0.20 }
  claude-haiku-5-5: { input: 0.10, output: 0.50 }   # 프롬프트 10만 토큰 이하 단가(넘으면 0.50/2.50 — 분류 입력은 통화 하나라 해당 없음)
  voyage-4: { input: 0.06, output: 0, provider: voyage }   # 검색 질의 임베딩 — docs.voyageai.com/docs/pricing
  rerank-3: { input: 0.05, output: 0, provider: voyage }   # 리랭커(질의 토큰 × 문서 수 + 문서 토큰)
  text-embedding-3-small: { input: 0.02, output: 0, provider: openai }   # 검색 임베딩 비교 조건 — platform.openai.com/docs/pricing
  solar-mini4: { input: 0.10, output: 0.40, provider: upstage }  # Upstage OpenAI 호환 API(Batch 없음) — 옛 판정기 v1·v2 기록의 단가
  qwen3.5-2b-judge: { provider: mlx, base: mlx-community/Qwen3.5-2B-bf16, adapter: evaluation/finetune/qwen/adapters/full, input: 0, output: 0 }  # 로컬 MLX(Batch 없음) — 어댑터는 커밋하지 않는다
# 일일 비용 상한($) — 넘으면 즉시 호출을 하지 않는다(배치 제출은 상한 밖). 금액의 원본은 docs/치과 AX - 기능 정의.md §7 (tests/generator/test_doc_sync.py가 비교)
daily_usd_limit: { generator: 40, runtime: 15 }
