# 생성기 파라미터 값의 원본. 의미는 docs/치과 AX - 가상 데이터 생성 설계.md §0·§2.6·§5.3
seed: 20261201
today: 2026-12-01
range: { start: 2026-02-01, end: 2026-12-15 }
returning_patients: 1400    # 구환(창 이전 등록) 수. 모든 규모 고정 — 신환은 시뮬레이션 결과, 총수는 결과값(large ≈ 2,000)
visits_per_day: 26          # 하루 비취소 예약 상한(평일). 토요일 ×0.5
reschedule_rate: 0.05
noshow_rate: 0.06
sameday_cancel_rate: 0.04
confirm_rate: 0.85          # 직전 진료일 리마인드 응답
unpaid_rate: 0.15
settle_next_visit: 0.90       # 미수 중 다음 내원 때 정산, 나머지는 잔류 — 첫 large 실행에서 잔액 보유 비율 보고 확정
calls_with_transcript: 1000
calls_meta_only: 5000
eval_pool_size: 300
blind_pool_size: 150
documents: { core: 50, distractor: 27 }
messages: { appt_confirm: 1.0, reminder: 1.0, noshow: 1.0, balance: 0.5, reply_rate: 0.2 }
eob: { monthly_forms: 9, supplementary_ratio: 0.10 }   # supplementary_ratio는 정형 5단계(보완 청구 배정), monthly_forms는 EOB 슬롯·large 기준(창 안 확정·제출 월 수)
holidays: config/holidays_2026.json          # 출처: 한국천문연구원 2026 월력
forbidden_topics: config/forbidden_topics.json  # TODO: make data 전 2개 선정
# 규모: range.end 고정, 시작일만 늦춘다(확정월·제출월·전월·미래 구간 유지). visits_per_day는 유지.
# calls_*·eval_pool_size·blind_pool_size는 기간 비율(달력 일수, 양 끝 포함)로 축소·반올림. returning_patients·documents는 고정
# 판정·RAG 질문·eval·gate는 large에서만. small은 개발·테스트용
scale_presets:
  small:  { start: 2026-08-01 }   # 137/318 ≈ 0.43 — 테스트 fixture
  large:  { start: 2026-02-01 }   # 318/318 = 1.0 (= range)
