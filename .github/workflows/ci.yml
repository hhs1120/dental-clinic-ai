# PR·main 푸시마다 코드 컨벤션 검사(파이썬·프론트), 테스트, 프론트 빌드 (CLAUDE.md '명령') — 셋은 서로 기다리지 않게
# 따로 돈다. 테스트는 가짜 LLM 게이트웨이와 커밋된 LLM 캐시로 돌아 API 키가 필요 없다.
# fixture·Playwright까지 도는 make ci는 fixture가 생긴 뒤(기능 정의 §6)
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 의존성 (uv.lock 그대로, 파이썬은 .python-version)
        run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 코드 컨벤션
        run: make lint

  # 테스트는 러너 둘에 나눠 동시에 — 의미 묶음이 아니라 실행 시간이 반반이 되게 파일로 나눈 것.
  # 새 테스트는 part2로 들어간다. part2가 part1보다 30초 넘게 길어지면 무거운 파일을 part1로 옮긴다
  test:
    name: test (${{ matrix.part.name }})
    strategy:
      fail-fast: false
      matrix:
        part:
          - name: part1
            tests: tests/generator/test_records.py tests/generator/test_chart.py tests/generator/test_generator.py tests/generator/test_hard_calls.py tests/generator/test_verify_required.py
          - name: part2
            tests: --ignore=tests/generator/test_records.py --ignore=tests/generator/test_chart.py --ignore=tests/generator/test_generator.py --ignore=tests/generator/test_hard_calls.py --ignore=tests/generator/test_verify_required.py
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 의존성 (uv.lock 그대로, 파이썬은 .python-version)
        run: uv sync --locked
      - name: 테스트 (러너 코어 전부)
        run: make test JOBS=auto TESTS="${{ matrix.part.tests }}"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 프론트 빌드
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
