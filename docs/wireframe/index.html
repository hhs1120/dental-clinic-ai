<title>클로드치과 AX 와이어프레임</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 레이아웃: 상단 바(메뉴) + 1440px 업무 화면 한 장. 표·카드는 line-secondary 테두리, 그림자는 뜨는 층만. 디자인 시스템 "클로드치과 AX (몽타주 기반, 임시)" 토큰 그대로 */
:root{
  --bg-primary:#ffffff;--bg-secondary:#f7f7f8;--surface-elevated:#ffffff;
  --surface-secondary:#70737c14;--surface-tertiary:#70737c0d;--surface-brand-subtle:#0066ff0d;
  --fg-primary:#171719;--fg-secondary:#2e2f33e0;--fg-tertiary:#37383c9c;--fg-quaternary:#37383c47;
  --brand:#0066ff;--brand-strong:#005eeb;
  --positive:#00bf40;--cautionary:#ff9200;--cautionary-text:#9c5800;
  --negative:#ff4242;--negative-strong:#e52222;--negative-text:#b00c0c;
  --surface-cautionary:#ff920014;--surface-negative:#ff424214;--surface-positive:#00bf4014;
  --accent-violet:#5b37ed;--surface-accent-violet:#6541f214;
  --line-primary:#70737c38;--line-secondary:#eaebec;--line-brand-focus:#0066ff1f;
  --on-brand:#ffffff;
  --shadow-small:0px 2px 4px -2px #1717190f,0px 4px 6px -1px #1717190f;
  --shadow-medium:0px 4px 6px -2px #17171912,0px 10px 15px -3px #17171912;
  --font-sans:"Pretendard Variable",Pretendard,-apple-system,system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --space-4:4px;--space-8:8px;--space-12:12px;--space-16:16px;--space-20:20px;--space-24:24px;--space-32:32px;
  --radius-8:8px;--radius-10:10px;--radius-12:12px;--radius-full:9999px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg-primary:#1b1c1e;--bg-secondary:#0f0f10;--surface-elevated:#212225;
  --surface-secondary:#70737c38;--surface-tertiary:#70737c1f;--surface-brand-subtle:#3385ff0d;
  --fg-primary:#f7f7f8;--fg-secondary:#c2c4c8e0;--fg-tertiary:#aeb0b69c;--fg-quaternary:#aeb0b647;
  --brand:#3385ff;--brand-strong:#1a75ff;
  --positive:#1ed45a;--cautionary:#ffa938;--cautionary-text:#ffa938;
  --negative:#ff6363;--negative-strong:#ff6363;--negative-text:#ff6363;
  --surface-cautionary:#ffa93814;--surface-negative:#ff636314;--surface-positive:#1ed45a14;
  --accent-violet:#7d5ef7;--surface-accent-violet:#7d5ef714;
  --line-primary:#70737c52;--line-secondary:#333438;--line-brand-focus:#3385ff1f;
  --on-brand:#ffffff;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg-primary:#1b1c1e;--bg-secondary:#0f0f10;--surface-elevated:#212225;
  --surface-secondary:#70737c38;--surface-tertiary:#70737c1f;--surface-brand-subtle:#3385ff0d;
  --fg-primary:#f7f7f8;--fg-secondary:#c2c4c8e0;--fg-tertiary:#aeb0b69c;--fg-quaternary:#aeb0b647;
  --brand:#3385ff;--brand-strong:#1a75ff;
  --positive:#1ed45a;--cautionary:#ffa938;--cautionary-text:#ffa938;
  --negative:#ff6363;--negative-strong:#ff6363;--negative-text:#ff6363;
  --surface-cautionary:#ffa93814;--surface-negative:#ff636314;--surface-positive:#1ed45a14;
  --accent-violet:#7d5ef7;--surface-accent-violet:#7d5ef714;
  --line-primary:#70737c52;--line-secondary:#333438;--line-brand-focus:#3385ff1f;
  --on-brand:#ffffff;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg-secondary);color:var(--fg-primary);font-family:var(--font-sans);font-size:15px;line-height:22px;letter-spacing:.0096em;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg-primary)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;box-shadow:0 0 0 3px var(--line-brand-focus)}
.num,td.num,.tnum{font-variant-numeric:tabular-nums}
.wrap{max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 글자 단계 */
.title3{font-size:24px;line-height:32px;letter-spacing:-.023em;font-weight:700;margin:0;text-wrap:balance}
.heading1{font-size:22px;line-height:30px;letter-spacing:-.0194em;font-weight:600;margin:0}
.heading2{font-size:20px;line-height:28px;letter-spacing:-.012em;font-weight:600;margin:0}
.headline2{font-size:17px;line-height:24px;font-weight:600;margin:0}
.body1{font-size:16px;line-height:24px;letter-spacing:.0057em}
.label1{font-size:14px;line-height:20px;letter-spacing:.0145em;font-weight:500}
.label2{font-size:13px;line-height:18px;letter-spacing:.0194em;font-weight:500}
.caption1{font-size:12px;line-height:16px;letter-spacing:.0252em;font-weight:500}
.fg2{color:var(--fg-secondary)}.fg3{color:var(--fg-tertiary)}
.neg{color:var(--negative-text)}.caut{color:var(--cautionary-text)}.brand{color:var(--brand)}

/* 상단 바 */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg-primary);border-bottom:1px solid var(--line-secondary)}
.topbar .wrap{display:flex;align-items:center;gap:var(--space-16);min-height:56px;flex-wrap:wrap;padding-block:6px}
.logo{font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap;display:flex;align-items:center;gap:8px}
.logo .mark{width:22px;height:22px;border-radius:6px;background:var(--brand);display:inline-grid;place-items:center;color:var(--on-brand);font-size:12px;font-weight:700}
.nav{display:flex;gap:2px;align-items:center;overflow-x:auto;flex:1 1 520px;min-width:0;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:8px 12px;border-radius:var(--radius-10);text-decoration:none;color:var(--fg-secondary);font-size:14px;font-weight:600;white-space:nowrap}
.nav a:hover{background:var(--surface-tertiary)}
.nav a.on{color:var(--brand);background:var(--surface-brand-subtle)}
.nav .sep{width:1px;height:20px;background:var(--line-secondary);margin:0 8px;flex:none}
.nav .grp{font-size:12px;color:var(--fg-tertiary);margin-right:4px;white-space:nowrap}
.tb-right{display:flex;align-items:center;gap:12px;margin-left:auto;white-space:nowrap;flex-wrap:wrap;min-width:0}
.tb-right select{padding:6px 10px;border:1px solid var(--line-primary);border-radius:var(--radius-10);background:var(--bg-primary)}

main{padding-block:24px 72px}
.screen-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.screen-head .desc{flex:1 1 100%;color:var(--fg-tertiary);font-size:13px;line-height:18px;margin:0}
.updated{font-size:12px;color:var(--fg-tertiary)}
.stack{display:flex;flex-direction:column;gap:var(--space-16)}
.row{display:flex;gap:var(--space-8);flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:16px;align-items:start}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.split{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* 카드·표 */
.card{background:var(--surface-elevated);border:1px solid var(--line-secondary);border-radius:var(--radius-12);padding:var(--space-16);min-width:0}
.card h3{margin:0 0 12px}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto;background:var(--surface-elevated);border:1px solid var(--line-secondary);border-radius:var(--radius-12)}
table.tbl{border-collapse:collapse;width:100%;font-size:14px;line-height:20px}
.tbl th{background:var(--bg-secondary);height:44px;padding:0 20px;text-align:left;font-size:13px;font-weight:600;color:var(--fg-secondary);white-space:nowrap;border-bottom:1px solid var(--line-secondary)}
.tbl td{padding:12px 20px;border-bottom:1px solid var(--line-secondary);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-tertiary)}
.tbl tr.sel td{background:var(--surface-brand-subtle)}
.tbl tr.expand td{background:var(--surface-tertiary)}
.nowrap{white-space:nowrap}

/* 칩·배지·버튼 */
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:var(--radius-8);font-size:12px;line-height:16px;font-weight:600;white-space:nowrap;background:var(--surface-tertiary);color:var(--fg-secondary)}
.t-ins{background:var(--surface-brand-subtle);color:var(--brand)}
.t-bal{background:var(--surface-cautionary);color:var(--cautionary-text)}
.t-fam{background:var(--surface-accent-violet);color:var(--accent-violet)}
.t-alert{background:var(--surface-negative);color:var(--negative-text)}
.t-plan{background:var(--surface-secondary);color:var(--fg-primary)}
.t-pos{background:var(--surface-positive);color:var(--fg-primary)}
.t-pos::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--positive)}
.t-caut{background:var(--surface-cautionary);color:var(--cautionary-text)}
.t-neg{background:var(--surface-negative);color:var(--negative-text)}
.t-brand{background:var(--surface-brand-subtle);color:var(--brand)}
.t-ex{background:transparent;border:1px dashed var(--line-primary);color:var(--fg-tertiary);font-weight:500}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:var(--radius-12);border:1px solid var(--line-primary);background:var(--surface-elevated);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--fg-primary)}
.btn:hover{background:var(--surface-tertiary)}
.btn-sm{padding:4px 10px;border-radius:var(--radius-10);font-size:13px}
.btn-primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn-primary:hover{background:var(--brand-strong)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--brand)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.on{border-color:var(--brand);color:var(--brand);background:var(--surface-brand-subtle)}
.link{color:var(--brand);background:none;border:0;padding:0;cursor:pointer;font-weight:600;text-align:left}
.link:hover{text-decoration:underline}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:var(--radius-full);border:1px solid var(--line-primary);background:var(--surface-elevated);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;color:var(--fg-secondary)}
.fchip b{color:var(--fg-primary);font-variant-numeric:tabular-nums}
.fchip.on{background:var(--fg-primary);color:var(--bg-primary);border-color:var(--fg-primary)}
.fchip.on b{color:var(--bg-primary)}
.fchip .dot{width:8px;height:8px;border-radius:50%}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-secondary);margin-bottom:16px;overflow-x:auto}
.tab{padding:10px 14px;border:0;background:none;font-weight:600;font-size:15px;color:var(--fg-tertiary);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--fg-primary);border-bottom-color:var(--fg-primary)}
.tab .n{font-size:12px;margin-left:4px;color:var(--fg-tertiary);font-variant-numeric:tabular-nums}
.seg{display:inline-flex;background:var(--surface-secondary);border-radius:var(--radius-10);padding:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--fg-secondary);cursor:pointer}
.seg button.on{background:var(--surface-elevated);color:var(--fg-primary);box-shadow:var(--shadow-small)}
.input{padding:8px 12px;border:1px solid var(--line-primary);border-radius:var(--radius-10);background:var(--surface-elevated);min-width:0}
textarea.input{width:100%;resize:vertical}
.note-ex{font-size:12px;color:var(--fg-tertiary)}
.facts{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 12px;font-size:14px;margin:0}
.facts dt{color:var(--fg-tertiary)}
.facts dd{margin:0}
.evidence{border-top:1px dashed var(--line-primary);margin-top:10px;padding-top:8px;font-size:12px;color:var(--fg-tertiary)}
.evidence code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--surface-tertiary);padding:1px 4px;border-radius:4px;color:var(--fg-secondary)}
.placeholder{border:1px dashed var(--line-primary);border-radius:var(--radius-10);padding:16px;color:var(--fg-tertiary);font-size:13px;background:var(--surface-tertiary)}
.empty{padding:32px;text-align:center;color:var(--fg-tertiary)}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
h2.sec{margin:0 0 12px}

/* 오늘 */
.stat .v{font-size:28px;line-height:36px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .k{font-size:13px;color:var(--fg-tertiary)}
.stat{cursor:pointer;text-align:left;font:inherit}
.stat:hover{border-color:var(--line-primary)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-secondary)}
.list li:last-child{border-bottom:0}
.list .meta{color:var(--fg-tertiary);font-size:12px;white-space:nowrap}
.list .main{flex:1;min-width:0}
.list button.item{all:unset;cursor:pointer;display:block}
.list button.item:hover .ttl{color:var(--brand)}
.list button.item:focus-visible{outline:2px solid var(--brand)}
.briefing{display:flex;gap:16px;align-items:flex-start}
.briefing .ic{width:40px;height:40px;border-radius:10px;background:var(--surface-brand-subtle);display:grid;place-items:center;flex:none}

/* 준비표 */
.datebar{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.datebtn{padding:8px 16px;border-radius:var(--radius-full);border:1px solid var(--line-primary);background:var(--surface-elevated);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums}
.datebtn.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.prog{height:4px;border-radius:2px;background:var(--surface-secondary);overflow:hidden;width:160px}
.prog i{display:block;height:100%;background:var(--brand);transition:width .2s}
.sched td,.sched th{padding:6px 8px;border:1px solid var(--line-secondary);font-size:13px;line-height:18px;vertical-align:top}
.sched{border-collapse:collapse;width:100%;min-width:860px}
.sched th{background:var(--bg-secondary);height:36px;text-align:center}
.sched td.t{white-space:nowrap;color:var(--fg-tertiary);font-variant-numeric:tabular-nums;width:64px;background:var(--bg-secondary)}
.appt{border-radius:8px;padding:6px 8px;background:var(--surface-tertiary);border:1px solid var(--line-secondary);height:100%;cursor:pointer;margin-bottom:4px}
.appt.hyg{background:var(--surface-brand-subtle)}
.appt.todo{border-left:3px solid var(--negative)}
.appt.dim{opacity:.35}
.busy{display:flex;align-items:flex-end;gap:6px;height:72px}
.busy .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end;height:100%}
.busy .bar{width:100%;background:var(--fg-quaternary);border-radius:3px 3px 0 0;min-height:2px}
.busy .bar.peak{background:var(--brand)}
.busy .lb{font-size:11px;color:var(--fg-tertiary);font-variant-numeric:tabular-nums}
.chairlist{list-style:none;margin:0;padding:0}
.chairlist li button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:56px minmax(0,1fr);gap:8px;width:100%;padding:10px 12px;border-bottom:1px solid var(--line-secondary);cursor:pointer}
.chairlist li button:hover{background:var(--surface-tertiary)}
.chairlist li button.on{background:var(--surface-brand-subtle)}
.chairlist li button:focus-visible{outline:2px solid var(--brand)}
.nowcard .alerts{display:flex;flex-direction:column;gap:8px;margin:16px 0}
.nowcard .alert-big{font-size:28px;line-height:36px;font-weight:700;color:var(--negative-text);background:var(--surface-negative);border-radius:var(--radius-12);padding:12px 16px}
.nowcard .alert-big small{display:block;font-size:15px;line-height:22px;font-weight:600;color:var(--fg-secondary)}

/* 통화 */
.transcript-slot{min-height:120px;display:grid;place-items:center;text-align:center}
.tx{display:grid;gap:6px;max-height:360px;overflow:auto;padding:12px 14px;border:1px solid var(--line-primary);border-radius:var(--radius-10);background:var(--surface-tertiary)}
.tx.open{max-height:none}
.tx-line{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px;font-size:13px;line-height:1.6}
.tx-who{color:var(--fg-tertiary);font-weight:600;font-size:12px;padding-top:1px}
.tx-line.staff .tx-who{color:var(--brand)}
.chartnote{border:1px solid var(--line-primary);border-radius:var(--radius-10);padding:12px 14px;background:var(--surface-tertiary)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv div{background:var(--surface-tertiary);border-radius:var(--radius-10);padding:8px 10px}
.kv span{display:block;font-size:12px;color:var(--fg-tertiary)}
@media (max-width:600px){.kv{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* 물어보기 */
.chat{display:flex;flex-direction:column;gap:12px}
.bubble-q{align-self:flex-end;background:var(--brand);color:var(--on-brand);padding:10px 14px;border-radius:14px 14px 4px 14px;max-width:70%}
.bubble-a{background:var(--surface-elevated);border:1px solid var(--line-secondary);padding:12px 16px;border-radius:14px 14px 14px 4px;max-width:85%}
.src{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.srccard{border:1px solid var(--line-secondary);border-radius:var(--radius-10);padding:8px 10px;font-size:13px;background:var(--bg-primary);cursor:pointer;text-align:left}
.srccard:hover{border-color:var(--brand)}
.steps{font-size:12px;color:var(--fg-tertiary);display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.steps span::before{content:"✓ "}
.docbody h1{font-size:20px;line-height:28px;margin:0 0 8px}
.docbody h2{font-size:16px;line-height:24px;margin:16px 0 6px}
.docbody p{margin:6px 0}
.docbody ul{margin:6px 0;padding-left:20px}
mark{background:var(--surface-cautionary);color:inherit;border-radius:3px;padding:0 2px}
.doclist button{all:unset;box-sizing:border-box;display:block;width:100%;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:14px}
.doclist button:hover{background:var(--surface-tertiary)}
.doclist button.on{background:var(--surface-brand-subtle);color:var(--brand)}
.doclist button:focus-visible{outline:2px solid var(--brand)}
.dgroup{font-size:12px;color:var(--fg-tertiary);margin:12px 12px 4px;font-weight:600}

/* 판정 */
.jrow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line-secondary);align-items:start}
.jrow.active{background:var(--surface-brand-subtle);margin:0 -16px;padding:10px 16px}
.jrow .lbl{font-weight:600;padding-top:6px}
.opt{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border:1px solid var(--line-primary);border-radius:var(--radius-10);background:var(--surface-elevated);font-size:14px;cursor:pointer;margin:0 6px 6px 0}
.opt kbd{font-family:inherit;font-size:12px;color:var(--fg-tertiary);font-variant-numeric:tabular-nums}
.opt.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.opt.on kbd{color:var(--on-brand)}
.opt.model{box-shadow:inset 0 0 0 2px var(--accent-violet)}
.kbdhelp{font-size:12px;color:var(--fg-tertiary)}
kbd.k{display:inline-block;border:1px solid var(--line-primary);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-family:inherit;font-size:11px;background:var(--bg-primary)}
.vs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:700px){.vs{grid-template-columns:minmax(0,1fr)}.jrow{grid-template-columns:minmax(0,1fr)}}
.meter{height:8px;border-radius:4px;background:var(--surface-secondary);overflow:hidden;min-width:80px}
.meter i{display:block;height:100%;background:var(--brand)}

/* EMR — 일부러 투박하게 (옛 병원 프로그램) */
.emr{border:1px solid var(--line-primary);background:var(--bg-secondary);font-size:12px;line-height:16px;font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
.emr .titlebar{background:var(--surface-secondary);border-bottom:1px solid var(--line-primary);padding:4px 8px;font-weight:700;display:flex;gap:12px;flex-wrap:wrap}
.emr .body{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:640px}
@media (max-width:800px){.emr .body{grid-template-columns:minmax(0,1fr)}}
.emr .left{border-right:1px solid var(--line-primary);padding:6px;display:flex;flex-direction:column;gap:6px;min-width:0}
.emr input,.emr select{border:1px solid var(--line-primary);border-radius:0;padding:2px 4px;background:var(--bg-primary);font-size:12px}
.emr .plist{border:1px solid var(--line-primary);background:var(--bg-primary);overflow:auto;height:600px}
.emr .plist table{border-collapse:collapse;width:100%}
.emr .plist td,.emr .plist th{border-bottom:1px solid var(--line-secondary);padding:2px 4px;white-space:nowrap;text-align:left}
.emr .plist th{background:var(--bg-secondary);position:sticky;top:0;z-index:1}
.emr .plist tr{cursor:pointer}
.emr .plist tr.on td{background:var(--brand);color:var(--on-brand)}
.emr .right{padding:6px;min-width:0}
.emr .phead{border:1px solid var(--line-primary);background:var(--bg-primary);padding:4px 6px;display:flex;gap:16px;flex-wrap:wrap}
.emr .phead b{font-size:13px}
.emr .etabs{display:flex;gap:0;margin-top:6px;flex-wrap:wrap}
.emr .etab{border:1px solid var(--line-primary);border-bottom:0;background:var(--surface-secondary);padding:3px 10px;cursor:pointer;font-size:12px;border-radius:0;margin-right:-1px}
.emr .etab.on{background:var(--bg-primary);font-weight:700}
.emr .pane{border:1px solid var(--line-primary);background:var(--bg-primary);padding:6px;overflow:auto;max-height:620px}
.emr table.g{border-collapse:collapse;width:100%}
.emr table.g th,.emr table.g td{border:1px solid var(--line-secondary);padding:2px 6px;text-align:left;white-space:nowrap}
.emr table.g th{background:var(--surface-secondary);font-weight:600}
.emr table.g td.num{text-align:right;font-variant-numeric:tabular-nums}
.emr .status{border-top:1px solid var(--line-primary);background:var(--surface-secondary);padding:2px 8px;display:flex;gap:16px;flex-wrap:wrap;color:var(--fg-secondary)}

.foot-note{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:25;background:var(--surface-elevated);border:1px solid var(--line-secondary);border-radius:var(--radius-8);padding:4px 10px;font-size:11px;color:var(--fg-tertiary);box-shadow:var(--shadow-small);max-width:calc(100% - 24px)}
.loading{padding:80px 0;text-align:center;color:var(--fg-tertiary)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:600px){.tb-right .lbl-date,.tb-right label{display:none}.tb-right{margin-left:0}.tbl td,.tbl th{padding-left:12px;padding-right:12px}}

<script>
"use strict";
/* ───────── 상수·도우미 ───────── */
const TODAY = "2026-12-01", NOW = "08:50";
const APPEAL_DAYS = 90; // generator/master.py APPEAL_DAYS (재심 기한 = 통보일 + APPEAL_DAYS)
const S = {
  data:null, screen:"today", user:"원장",
  prepDate:TODAY, prepChip:"all", prepType:"all", prepTodoOnly:false, prepView:"table", prepOpen:null, prepRegen:null, prepUpdated:"05:30",
  meetType:"all", chairSel:1, chairPick:null,
  callsTab:"list", callFilter:"all", callQ:"", callSel:null, done:{}, pasteResult:null,
  askTab:"chat", askInput:"", chat:null, searchQ:"스케일링", srcTypes:{doc:true,call:true,msg:true,chart:true}, sFrom:"", sTo:"", sChart:"", docSel:null, docType:"all",
  evalTab:"judge", jIdx:0, jAns:{}, jActive:0, jBuf:"", jSaved:false, jMemo:"", judged:[], bIdx:0, bVotes:[], bRevealed:null,
  emrChart:null, emrTab:"기본정보", emrQ:"", emrMoves:0,
  claimChip:"all", claimOpen:null, claimJudge:{},
  finMonth:"2026-11", finOpen:null, finConfirm:{},
  followChip:"all", followTop:false, followHideContacted:false, contacted:{}, howOpen:false

const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const won = n => (n||0).toLocaleString("ko-KR") + "원";
const commas = n => (n||0).toLocaleString("ko-KR");
const DOW = "일월화수목금토";
const dObj = d => new Date(d + "T00:00:00Z");
const dow = d => DOW[dObj(d).getUTCDay()];
const md = d => { const [, m, dd] = d.split("-"); return `${+m}/${+dd}`; };
const mdw = d => `${md(d)}(${dow(d)})`;
const addDays = (d, n) => { const x = dObj(d); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const dayDiff = (a, b) => Math.round((dObj(b) - dObj(a)) / 864e5);
const tmin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const tstr = m => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
const nowPlus = k => tstr(tmin(NOW) + k);
const EX = '<span class="tag t-ex" title="실제 앱에서는 LLM·배치가 채우는 칸">예시</span>';
const USER_NAME = { "원장":"원장 한명숙", "데스크":"데스크 서영수", "상담실장":"상담실장 박우진" };

const FLAG_KO = { emergency:"응급·통증", complaint:"불만", price_inquiry:"가격 문의", wants_appt:"예약 희망", appt_confirmed:"예약 확정", has_todo:"할 일 있음" };
const DOC_TYPE = { manual:"직원 매뉴얼", notice:"원내 공지", faq:"환자 FAQ", insurance_guide:"보험 안내", claim_standard:"청구 기준", education:"환자 교육", external:"외부 자료" };
const MSG_TRIG = { appt_confirm:"예약 확정", reminder:"리마인드", reply:"환자 답장", recall:"리콜", balance:"미수 안내", noshow:"노쇼", doc_ready:"서류 준비" };
const PAY_KIND = { visit:"진료비", settlement:"미수 정산" };
const PAY_METHOD = { card:"카드", cash:"현금", transfer:"계좌이체" };
const CLAIM_ST = { paid:"지급", pending:"청구 전", submitted:"심사 중", adjusted:"조정", denied:"불능" };
const PLAN_ST = { open:"미시행", done:"완료", cancelled:"취소" };
const RECON_CAUSES = ["분할결제","취소 후 재승인","수수료 차이","입금 지연","진료 외 매출","입력 누락","날짜 밀림","금액 오입력","결제수단 오입력","모르겠음"];

/* ───────── 준비표 칩·제안(규칙 예시) ───────── */
const ALERT_ACT = {
  "고혈압":"진료 전 혈압 측정", "당뇨":"혈당·식사 여부 확인", "항응고제 복용":"출혈 주의, 복용 여부 확인",
  "페니실린 알레르기":"항생제는 페니실린 계열 피하기", "에피네프린 민감":"에피네프린 없는 마취제",
  "폐소공포증":"얼굴 덮개 쓰지 않기", "구역반사":"인상·촬영 때 구역반사 주의", "치과 공포":"충분히 설명하고 천천히",
  "체어 눕히지 말고 진료":"체어 세워서 진료", "개구 제한":"짧게 끊어서, 작은 기구", "마취 후 실신 이력":"눕힌 자세로 마취 후 관찰",
  "마취가 잘 안 됨":"마취 시간 넉넉히", "인공관절·인공판막":"예방적 항생제 필요 여부 확인"
};
const CHIP_DEF = [
  { k:"all",   label:"예약",         cls:"",        dot:"var(--fg-quaternary)" },
  { k:"ins",   label:"보험 잔여",     cls:"t-ins",   dot:"var(--brand)" },
  { k:"bal",   label:"미수 잔액",     cls:"t-bal",   dot:"var(--cautionary)" },
  { k:"fam",   label:"가족 리콜 지남", cls:"t-fam",   dot:"var(--accent-violet)" },
  { k:"alert", label:"주의",         cls:"t-alert", dot:"var(--negative)" },
  { k:"plan",  label:"남은 치료계획", cls:"t-plan",  dot:"var(--fg-tertiary)" }
];
function has(r, k) {
  const c = r.chips;
  if (k === "all") return true;
  if (k === "ins") return c.scaling_unused;
  if (k === "bal") return c.balance > 0;
  if (k === "fam") return c.family_recall.length > 0;
  if (k === "alert") return c.alerts.length > 0;
  if (k === "plan") return c.open_plan.length > 0;
}
function chipTags(r) {
  const c = r.chips, out = ['<span class="tag">예약</span>'];
  if (c.scaling_unused) out.push('<span class="tag t-ins">보험 잔여</span>');
  if (c.balance > 0) out.push(`<span class="tag t-bal tnum">미수 ${won(c.balance)}</span>`);
  c.family_recall.forEach(f => out.push(`<span class="tag t-fam">가족 리콜 · ${esc(f.name)}</span>`));
  c.alerts.forEach(a => out.push(`<span class="tag t-alert">주의 · ${esc(a.label)}</span>`));
  c.open_plan.forEach(p => out.push(`<span class="tag t-plan">남은 계획 · ${esc(p.procedure)}${p.tooth && p.tooth !== "00" ? " " + esc(p.tooth) : ""}</span>`));
  if (r.new_patient) out.push('<span class="tag t-brand">신환</span>');
  return out.join("");
}
function suggest(r) {
  const c = r.chips, p = [];
  c.alerts.forEach(a => p.push({ t: ALERT_ACT[a.label] || a.label + " 확인", f: `alerts[${a.label}]` }));
  if (c.balance > 0) p.push({ t: `미수 ${won(c.balance)} 수납 안내`, f: `balance=${c.balance}` });
  if (c.scaling_unused && r.procedure !== "스케일링") p.push({ t: "올해 스케일링 급여 미사용, 권유", f: "scaling_unused=true" });
  c.family_recall.forEach(f => p.push({ t: `가족 ${f.name}님 리콜 지남, 함께 안내`, f: `family_recall[${f.name}, 마지막 ${f.last_hygiene}]` }));
  c.open_plan.forEach(x => p.push({ t: `남은 치료 ${x.procedure}${x.tooth && x.tooth !== "00" ? "(" + x.tooth + ")" : ""} 예약 상의`, f: `open_plan[${x.procedure} ${x.tooth}]` }));
  const short = p.length ? p.slice(0, 2).map(x => x.t).join(" · ") + (p.length > 2 ? ` 외 ${p.length - 2}` : "") : "그대로 진행";
  return { action: p.length ? "suggest" : "none", parts: p, short };
}
const hasTodo = r => suggest(r).action === "suggest";

/* ───────── 통화 요약·할 일(정답 라벨·사실로 만든 예시 문장) ───────── */
function callSummary(c) {
  const f = c.facts, a = c.ai, bits = [];
  const who = c.patient ? `${c.caller}님` : `${c.caller}님(처음 연락)`;
  bits.push(`${who}, ${a.purpose}${a.also.length ? "(" + a.also.join("·") + " 함께)" : ""}.`);
  if (f.appointment) bits.push(`${mdw(f.appointment.date)} ${f.appointment.time} ${f.appointment.procedure} 예약${a.flags.includes("appt_confirmed") ? " 확정" : " 이야기"}.`);
  if (f.topic_procedure) bits.push(`${f.topic_procedure} 관련해 물어봄.`);
  if (f.recall_text) bits.push(`${md(f.recall_text.sent_at.slice(0, 10))} 리콜 안내 문자를 보고 연락.`);
  if (f.balance) bits.push(`미수 ${won(f.balance)} 남아 있음.`);
  if (f.already_paid) bits.push(`${md(f.already_paid.date)}에 ${won(f.already_paid.amount)} 이미 냈다고 함.`);
  if (a.flags.includes("emergency")) bits.push("통증이 있어 빨리 봐 달라고 함.");
  if (a.flags.includes("complaint")) bits.push("불편했던 점을 이야기함.");
  return bits.join(" ");
}
function callTodo(c) {
  if (!c.ai.flags.includes("has_todo")) return null;
  const p = c.ai.purpose;
  if (c.ai.flags.includes("emergency")) return "오늘 진료 가능한 시간 확인해 다시 전화";
  if (p === "예약 잡기") return c.ai.flags.includes("appt_confirmed") ? "예약 확정 문자 보내기" : "빈 시간 찾아 예약 잡고 연락";
  if (p === "예약 변경") return "바뀐 예약 확인 문자 보내기";
  if (p === "예약 취소") return "취소 처리, 대기자에게 빈자리 연락";
  if (p === "치료 문의") return "원장 확인 뒤 회신 전화";
  if (p === "가격·비용 문의") return "견적 확인해 회신";
  if (p === "보험 문의") return "보험 적용 여부 확인해 회신";
  if (p === "수납·청구 문의") return "수납 내역 확인해 회신";
  if (p === "서류·기록 요청") return "서류 준비되면 연락";
  if (p === "불만") return "상담실장 확인 뒤 사과 전화";
  if (p === "리콜 문의") return "검진 예약 잡고 연락";
  return "내용 확인 뒤 회신";
}
const isUrgent = c => c.ai.urgency === "급함";
function followQueue() {
  return S.data.calls.filter(c => c.ai.flags.includes("has_todo") && !S.done[c.uid])
    .sort((a, b) => (isUrgent(b) - isUrgent(a)) || (a.at < b.at ? 1 : -1));
}
function urgTag(u) { return u === "급함" ? '<span class="tag t-neg">급함</span>' : u === "낮음" ? '<span class="tag">낮음</span>' : '<span class="tag">보통</span>'; }

/* ───────── 후속 관리 점수(코드 점수 예시) ───────── */
const FOLLOW_W = { "리콜 연체":25, "올해 스케일링 급여 미사용":20, "진료계획 미예약":20, "노쇼 뒤 재예약 없음":15, "미수 잔액":10, "다른 치과 추정":-30 };
function followScore(f) {
  let s = f.chips.reduce((t, c) => t + (FOLLOW_W[c] || 0), 0);
  const months = f.last_visit ? Math.floor(dayDiff(f.last_visit, TODAY) / 30) : 24;
  s += Math.max(0, 12 - Math.max(0, months - 6)); // 마지막 방문이 오래될수록 감점(돌아올 가능성)
  return s;
}

/* ───────── 청구 ───────── */
const isDxError = a => a.note.includes("상병");
function claimDeadline(a) { const d = addDays(a.reviewed, APPEAL_DAYS); return { d, left: dayDiff(TODAY, d) }; }
function claimDocId(proc) {
  if (/스케일링|실란트|불소/.test(proc)) return 16;
  if (/잇몸|치주/.test(proc)) return 91;
  if (/발치|임플란트/.test(proc)) return 4;
  if (/레진|아말감|크라운|브릿지|신경/.test(proc)) return 84;
  return 57;
}
function transcriptHTML(t, open) {
  if (!t) return `<div class="placeholder">전사 없음</div>`;
  return `<div class="tx ${open ? "open" : ""}">${t.split("\n").filter(Boolean).map(l => { const staff = l.startsWith("직원:"); const who = staff ? "직원" : l.startsWith("환자:") ? "상대" : ""; return `<div class="tx-line ${staff ? "staff" : ""}"><span class="tx-who">${who}</span><span>${esc(l.replace(/^(직원|환자):\s?/, ""))}</span></div>`; }).join("")}</div>`;
}
function claimAISuggest(a) {
  if (isDxError(a)) return { v:"정당", why:"차트 상병과 시술이 맞지 않아 깎임. 상병 착오는 재청구가 안 됨" };
  if (/기재 누락|내역설명|증빙/.test(a.note)) return { v:"보완 후 재청구", why:"청구 때 빠진 기재·증빙을 채우면 다시 낼 수 있음" };
  if (/소견 미확인|확인 불가|근거 부족/.test(a.note)) return { v:"다툴 만함", why:"차트 서술에 소견·근거가 있으면 재심 사유가 됨 — 아래 그 진료의 차트 서술 확인" };
  return { v:"정당", why:"기준 절 조건(간격·대상 치아)에 해당" };
}

/* ───────── 화면 렌더 ───────── */
const R = {};
function render() {
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.dataset.s === S.screen));
  const fn = R[S.screen] || R.today;
  $("#main").innerHTML = fn();

}
function head(title, desc, right = "") {
  return `<div class="screen-head"><h1 class="title3">${title}</h1>${right}<p class="desc">${desc}</p></div>`;
}

/* ── 오늘 ── */
R.today = () => {
  const d = S.data, rows = d.prep[TODAY];
  const newP = rows.filter(r => r.new_patient), alertRows = rows.filter(r => r.chips.alerts.length);
  const q = followQueue(), urgentQ = q.filter(isUrgent);
  const hourCnt = {}; rows.forEach(r => { const h = r.time.slice(0, 2); hourCnt[h] = (hourCnt[h] || 0) + 1; });
  const peakH = Object.entries(hourCnt).sort((a, b) => b[1] - a[1])[0];
  const byType = t => rows.filter(r => r.type === t).length;

  const appealSoon = d.slots.adjust.filter(a => !isDxError(a) && claimDeadline(a).left <= 30).sort((a, b) => a.reviewed < b.reviewed ? -1 : 1);
  const lastRecon = d.slots.recon.filter(r => r.mismatch_count).slice(-3).reverse();
  const tier1 = d.slots.follow.filter(f => f.chips.length >= 4).length;
  const judgedLeft = d.calls.length - S.judged.length;

  const stat = (v, k, go, sub = "") => `<button class="card stat" data-act="go" data-arg="${go}"><div class="v">${v}</div><div class="k">${k}${sub}</div></button>`;
  const job = (st, ttl, meta, go) => {
    const t = st === "ok" ? '<span class="tag t-pos">끝남</span>' : st === "hand" ? '<span class="tag t-caut">사람에게 넘김</span>' : '<span class="tag t-neg">실패</span>';
    return `<li><span style="min-width:96px">${t}</span><div class="main"><button class="item" data-act="go" data-arg="${go}"><div class="ttl label1">${ttl}</div><div class="caption1 fg3">${meta}</div></button></div></li>`;
  };
  const todo = (tag, ttl, meta, act, arg) => `<li><span style="min-width:96px">${tag}</span><div class="main"><button class="item" data-act="${act}" data-arg="${esc(arg)}"><div class="ttl label1">${ttl}</div><div class="caption1 fg3">${meta}</div></button></div></li>`;

  return head(`안녕하세요, ${esc(USER_NAME[S.user])}님`, `12월 1일(화) 아침 화면입니다. 숫자는 전부 EMR·통화 기록을 코드로 센 값이고, AI 문장에는 예시 표시를 달았습니다.`, `<span class="updated">마지막 갱신 ${NOW}</span>`) + `
  <div class="grid4">
    ${stat(rows.length + "명", "오늘 예약", "prep", ` · 진료 ${byType("진료")} · 위생 ${byType("위생")} · 상담 ${byType("상담")}`)}
    ${stat(newP.length + "명", "신환", "prep")}
    ${stat(alertRows.length + "명", "주의 환자", "prep")}
    ${stat(q.length + "건", "후속 큐(할 일 있는 통화)", "calls", ` · 급함 ${urgentQ.length}`)}
  </div>

  <div class="card mt16 briefing">
    <div class="ic" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="color:var(--brand)"><path d="M4 12a8 8 0 0 1 16 0"/><path d="M7.5 12a4.5 4.5 0 0 1 9 0"/><circle cx="12" cy="12" r="1.5"/></svg></div>
    <div style="min-width:0">
      <div class="row"><h2 class="headline2">아침 브리핑</h2>${EX}<span class="caption1 fg3">숫자는 쿼리, 문장은 LLM이 묶음 · 08:30 사내 메신저로 읽어 줌</span></div>
      <p class="body1" style="margin:8px 0 0">오늘 예약은 ${rows.length}명이고 그중 신환이 ${newP.length}명입니다. 진료 ${byType("진료")}건, 위생 ${byType("위생")}건, 상담 ${byType("상담")}건이 잡혀 있습니다. 가장 바쁜 시간대는 ${+peakH[0]}시대(${peakH[1]}명)입니다. 주의사항이 있는 환자가 ${alertRows.length}명이라 준비표에서 미리 확인해 주세요. 후속 큐에 연락이 남은 통화가 ${q.length}건이고, 그중 급한 건이 ${urgentQ.length}건입니다.</p>
      <div class="evidence">근거 <code>appointments=${rows.length}</code> <code>new_patients=${newP.length}</code> <code>peak_hour=${peakH[0]}시(${peakH[1]})</code> <code>alert_patients=${alertRows.length}</code> <code>followups=${q.length}</code> · 본문 숫자가 전부 입력에 있는지 후검증</div>
    </div>
  </div>

  <div class="grid2 mt16">
    <section class="card">
      <div class="card-head"><h2 class="headline2">AI가 한 일</h2>${EX}<span class="spacer"></span><span class="updated">밤사이 배치 · ax_jobs</span></div>
      <ul class="list">
        ${job("ok", `통화 분류 ${yCalls.length}건`, `어제(11/30) 통화 · 03:10 끝남 · prompt v1`, "calls")}
        ${job("ok", `진료 준비표 ${rows.length}행 만들기`, `12/1 예약 전부 · 05:30 끝남 · 제안 ${rows.filter(hasTodo).length}행, 그대로 진행 ${rows.filter(r => !hasTodo(r)).length}행`, "prep")}
        ${job("ok", `문서 색인 ${d.docs.length}개`, "매뉴얼·공지·FAQ·청구 기준 · 04:00 끝남", "ask")}
        ${job("ok", `일계표 대조 11/30`, "장부 ↔ 카드 승인 · 04:20 끝남", "finance")}
        ${job("hand", "준비표 제안 1행 후검증 실패", "제안 문장 속 금액이 사실에 없어 비워 둠 → 다시 만들기 대기", "prep")}
        ${job("hand", "통화 1건 분류 애매", "목적을 '모르겠음·애매'로 냄 → 판정 큐 맨 앞", "eval")}
        ${job("fail", "11/30 통장 입금 내역 받기", "은행 파일이 아직 없음 · 07:00 다시 시도 실패", "finance")}
      </ul>
    </section>
    <section class="card">
      <div class="card-head"><h2 class="headline2">사람이 볼 일</h2><span class="spacer"></span><span class="updated">누르면 그 화면으로</span></div>
      <ul class="list">
        ${urgentQ.slice(0, 3).map(c => todo('<span class="tag t-neg">급한 통화</span>', `${esc(c.caller)} · ${esc(c.ai.purpose)}`, `${c.at.slice(5).replace("-", "/")} · ${esc(callTodo(c))}`, "openCall", c.uid)).join("")}
        ${todo('<span class="tag t-caut">후속 큐</span>', `할 일 있는 통화 ${q.length}건 남음`, "급함 먼저 · 처리하면 빠짐", "openFollow", "")}
        ${alertRows.slice(0, 4).map(r => todo('<span class="tag t-alert">주의 환자</span>', `${r.time} ${esc(r.patient.name)} · ${esc(r.procedure)}`, r.chips.alerts.map(a => esc(a.label)).join(", "), "openPrep", r.appt_id)).join("")}
        ${alertRows.length > 4 ? todo('<span class="tag t-alert">주의 환자</span>', `외 ${alertRows.length - 4}명`, "준비표에서 '주의' 칩으로 보기", "openPrepChip", "alert") : ""}
        ${todo('<span class="tag">판정 대기</span>', `통화 판정 ${judgedLeft}건 남음`, `판정 풀 ${d.calls.length}건 중 오늘 ${S.judged.length}건 판정`, "go", "eval")}
        ${todo('<span class="tag">근거 없음</span>', "“유치는 언제 빠져?”", "11/30 16:12 데스크 · 문서함에 없음 → 채울 문서 후보", "askQ", "유치는 언제 빠져?")}
        ${todo('<span class="tag">근거 없음</span>', "“주말에 응급으로 갈 수 있는 근처 치과 있어?”", "11/28 10:40 데스크 · 문서함에 없음", "askQ", "주말에 응급으로 갈 수 있는 근처 치과 있어?")}
        ${appealSoon.slice(0, 2).map(a => { const dl = claimDeadline(a); return todo('<span class="tag t-caut">재심 기한</span>', `${esc(a.name)} · ${esc(a.procedure)} 조정 ${won(a.claimed - a.paid)}`, `기한 ${mdw(dl.d)} · ${dl.left}일 남음`, "go", "claims"); }).join("")}
        ${todo('<span class="tag t-fam">후속 관리</span>', `1순위 ${tier1}명`, "예약 없이 놓친 환자 · 칩 4개 이상", "go", "followup")}
        ${lastRecon.map(r => todo('<span class="tag t-neg">일계표 불일치</span>', `${mdw(r.date)} 불일치 ${r.mismatch_count}건`, "조사 과정 보고 맞음/아님 확정", "openRecon", r.date)).join("")}
      </ul>
    </section>
  </div>`;
};

/* ── 통화 ── */
R.calls = () => {
  const d = S.data, q = followQueue();
  const tabs = [["list", "통화 목록", d.calls.length], ["follow", "후속 큐", q.length], ["paste", "붙여넣기", ""]];
  let body = "";
  if (S.callsTab === "list") body = callsList();
  else if (S.callsTab === "follow") body = callsFollow(q);
  else body = callsPaste();
  return head("통화", "끊긴 통화마다 AI가 요약·분류·할 일을 붙입니다. 전사는 생성기가 만든 가상 통화이고, 분류 칸은 지금 정답 라벨로 채운 예시입니다.", `<span class="updated">마지막 갱신 ${NOW} · 10분마다 색인</span>`) +
    `<div class="tabs" role="tablist">${tabs.map(([k, l, n]) => `<button class="tab ${S.callsTab === k ? "on" : ""}" data-act="callsTab" data-arg="${k}">${l}${n !== "" ? `<span class="n">${n}</span>` : ""}</button>`).join("")}</div>` + body;
};
function callsList() {
  const all = S.data.calls;
  const F = [["all", "전체", () => true], ["in", "수신", c => c.direction === "수신"], ["out", "발신", c => c.direction === "발신"], ["urgent", "급함", isUrgent], ["todo", "할 일 있음", c => c.ai.flags.includes("has_todo")], ["emg", "응급·통증", c => c.ai.flags.includes("emergency")], ["new", "처음 연락", c => !c.patient]];
  const f = F.find(x => x[0] === S.callFilter)[2];
  const qq = S.callQ.trim();
  const rows = all.filter(f).filter(c => !qq || (c.caller + c.phone + (c.patient ? c.patient.chart_no : "") + c.ai.purpose).includes(qq));
  const sel = S.callSel && all.find(c => c.uid === S.callSel);
  return `<div class="row" style="margin-bottom:12px">${F.map(([k, l, fn]) => `<button class="fchip ${S.callFilter === k ? "on" : ""}" data-act="callFilter" data-arg="${k}">${l} <b>${all.filter(fn).length}</b></button>`).join("")}
    <span class="spacer"></span><input id="callQ" class="input" placeholder="이름·번호·차트번호" value="${esc(S.callQ)}" aria-label="통화 검색"></div>
  <div class="${sel ? "split" : ""}">
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>시각</th><th>방향</th><th>상대</th><th>AI 분류 · 목적</th><th>급함</th><th>표시</th><th>할 일</th></tr></thead><tbody>
    ${rows.map(c => `<tr class="click ${S.callSel === c.uid ? "sel" : ""}" data-act="callSel" data-arg="${c.uid}">
      <td class="num">${c.at.slice(5, 10).replace("-", "/")} ${c.at.slice(11)}</td>
      <td>${c.direction}</td>
      <td class="nowrap"><b>${esc(c.caller)}</b><div class="caption1 fg3 tnum">${c.patient ? esc(c.patient.chart_no) : "차트 없음"} · ${esc(c.phone)}</div></td>
      <td>${esc(c.ai.purpose)}${c.ai.also.length ? `<div class="caption1 fg3">+ ${esc(c.ai.also.join(", "))}</div>` : ""}</td>
      <td>${urgTag(c.ai.urgency)}</td>
      <td><div class="tags">${c.ai.flags.filter(x => x !== "has_todo").map(x => `<span class="tag ${x === "emergency" || x === "complaint" ? "t-neg" : ""}">${FLAG_KO[x]}</span>`).join("")}</div></td>
      <td>${c.ai.flags.includes("has_todo") ? (S.done[c.uid] ? '<span class="tag t-pos">처리함</span>' : '<span class="tag t-caut">있음</span>') : '<span class="fg3">—</span>'}</td></tr>`).join("") || `<tr><td colspan="7" class="empty">조건에 맞는 통화가 없습니다</td></tr>`}
    </tbody></table></div>
    ${sel ? callDetail(sel) : ""}
  </div>`;
}
function callDetail(c) {
  const f = c.facts, todo = callTodo(c);
  const factRows = [];
  if (c.patient) factRows.push(["환자", `${esc(c.patient.name)} ${esc(c.patient.chart_no)} · ${c.patient.age}세 ${c.patient.sex}`]);
  if (f.appointment) factRows.push(["예약", `${f.appointment.date} ${f.appointment.time} ${esc(f.appointment.procedure)}`]);
  if (f.topic_procedure) factRows.push(["물어본 시술", esc(f.topic_procedure)]);
  if (f.balance) factRows.push(["미수 잔액", won(f.balance)]);
  if (f.recall_text) factRows.push(["리콜 문자", `${f.recall_text.sent_at.slice(0, 16)} 발송 (${f.recall_text.due_month}월 ${f.recall_text.kind === "before" ? "예정" : "지남"})`]);
  if (f.already_paid) factRows.push(["이미 낸 돈", `${f.already_paid.date} ${won(f.already_paid.amount)}`]);
  return `<aside class="card stack" aria-label="통화 상세">
    <div class="row"><h2 class="heading2">${esc(c.caller)}</h2><span class="fg3 label2 tnum">${c.at} · ${c.direction} · ${c.duration_sec}초 · #${esc(c.uid)}</span><span class="spacer"></span><button class="btn btn-sm" data-act="callSel" data-arg="">닫기</button></div>
    <div><h3 class="headline2" style="margin-bottom:8px">전사</h3>${transcriptHTML(c.transcript)}</div>
    <div><div class="row"><h3 class="headline2">요약</h3>${EX}</div><p class="mt8" style="margin-bottom:0">${esc(callSummary(c))}</p></div>
    <div><h3 class="headline2" style="margin-bottom:8px">분류</h3>
      <div class="kv">
        <div><span>목적</span>${esc(c.ai.purpose)}</div><div><span>상대</span>${esc(c.ai.counterpart)}</div><div><span>급함</span>${esc(c.ai.urgency)}</div>
        ${["has_todo", "wants_appt", "appt_confirmed", "price_inquiry", "complaint", "emergency"].map(k => `<div><span>${FLAG_KO[k]}</span>${c.ai.flags.includes(k) ? "<b>예</b>" : "아니오"}</div>`).join("")}
      </div></div>
    <div><h3 class="headline2" style="margin-bottom:8px">할 일</h3>
      ${todo ? `<div class="row"><span class="label1">${esc(todo)}</span>${EX}<span class="spacer"></span>${S.done[c.uid] ? `<span class="tag t-pos">처리함 · ${esc(S.done[c.uid].by)} ${S.done[c.uid].at}</span>` : `<button class="btn btn-sm" data-act="done" data-arg="${c.uid}">처리함</button>`}</div>` : '<span class="fg3">없음</span>'}</div>
    <div class="evidence">근거 사실 (<code>used_facts</code>, 생성 때 통화에 넣은 사실)
      ${factRows.length ? `<dl class="facts mt8">${factRows.map(([k, v]) => `<dt>${k}</dt><dd class="tnum">${v}</dd>`).join("")}</dl>` : '<div class="mt8">EMR에서 찾은 사실 없음(처음 연락)</div>'}
      ${c.patient ? `<div class="mt8"><button class="link" data-act="emrOpen" data-arg="${c.patient.chart_no}">EMR에서 ${esc(c.patient.chart_no)} 보기</button></div>` : ""}
    </div>
  </aside>`;
}
function callsFollow(q) {
  const doneList = Object.entries(S.done).map(([uid, v]) => ({ c: S.data.calls.find(x => x.uid === uid), ...v }));
  return `<p class="label2 fg3" style="margin-top:0">AI 분류에서 '할 일 있음'인 통화만 모읍니다. 급한 건이 먼저, 그다음 최근 순. "처리함"을 누르면 빠지고 누가 언제 처리했는지 남습니다. 분류가 틀리면 할 일이 여기서 빠지므로 판정으로 분류를 잽니다.</p>
  <div class="tbl-wrap"><table class="tbl"><thead><tr><th>급함</th><th>시각</th><th>상대</th><th>목적</th><th>할 일 ${EX}</th><th>근거</th><th></th></tr></thead><tbody>
  ${q.map(c => `<tr><td>${urgTag(c.ai.urgency)}</td><td class="num">${c.at.slice(5, 10).replace("-", "/")} ${c.at.slice(11)}</td>
    <td class="nowrap"><button class="link" data-act="openCall" data-arg="${c.uid}">${esc(c.caller)}</button><div class="caption1 fg3 tnum">${esc(c.phone)}</div></td>
    <td>${esc(c.ai.purpose)}</td><td>${esc(callTodo(c))}</td>
    <td class="caption1 fg3">${Object.keys(c.facts).map(k => `<code>${k}</code>`).join(" ") || "—"}</td>
    <td class="num"><button class="btn btn-sm" data-act="done" data-arg="${c.uid}">처리함</button></td></tr>`).join("") || `<tr><td colspan="7" class="empty">남은 할 일이 없습니다</td></tr>`}
  </tbody></table></div>
  ${doneList.length ? `<h3 class="headline2 mt24" style="margin-bottom:8px">오늘 처리한 건 ${doneList.length}</h3>

  ${doneList.map(x => `<tr><td>${esc(x.c.caller)}</td><td>${esc(x.c.ai.purpose)}</td><td>${esc(x.by)}</td><td class="num">${x.at}</td><td class="num"><button class="btn btn-sm" data-act="undone" data-arg="${x.c.uid}">되돌리기</button></td></tr>`).join("")}
  </tbody></table></div>` : ""}`;
}

      <div class="kv mt12"><div><span>목적</span>예약 변경</div><div><span>상대</span>환자</div><div><span>급함</span>보통</div><div><span>할 일 있음</span><b>예</b></div><div><span>예약 희망</span><b>예</b></div><div><span>예약 확정</span>아니오</div></div>

      <div class="row mt12"><button class="btn btn-sm" data-act="emrOpen" data-arg="${r.patient.chart_no}">EMR에서 보기</button><span class="caption1 fg3">같은 사실을 EMR에서 보려면 탭 6개를 옮겨 다녀야 합니다</span></div>

function prepMeeting(rowsAll) {
  const tf = r => S.meetType === "all" || r.type === S.meetType;
  const chairs = [1, 2, 3, 4, 5, null];
  const start = Math.min(...rowsAll.map(r => tmin(r.time))), end = Math.max(...rowsAll.map(r => tmin(r.time) + r.duration));
  const s0 = Math.floor(start / 30) * 30, slots = [];
  for (let m = s0; m < end; m += 30) slots.push(m);
  const by = {}; chairs.forEach(c => by[c] = {});
  rowsAll.forEach(r => { const k = Math.floor(tmin(r.time) / 30) * 30; (by[r.chair] [k] = by[r.chair][k] || []).push(r); });
  const covered = {}; chairs.forEach(c => covered[c] = new Set());
  const hours = {}; rowsAll.filter(tf).forEach(r => { const h = r.time.slice(0, 2); hours[h] = (hours[h] || 0) + 1; });
  const hk = []; for (let h = Math.floor(s0 / 60); h * 60 < end; h++) hk.push(String(h).padStart(2, "0"));
  const maxH = Math.max(1, ...Object.values(hours));
  let body = "";
  slots.forEach(m => {
    body += `<tr><td class="t">${tstr(m)}</td>`;
    chairs.forEach(c => {
      if (covered[c].has(m)) return;
      const list = by[c][m];
      if (!list) { body += "<td></td>"; return; }
      let span = Math.max(...list.map(r => Math.ceil(r.duration / 30)));
      for (let k = 1; k < span; k++) { const mm = m + k * 30; if (by[c][mm] || mm >= end) { span = k; break; } covered[c].add(mm); }
      body += `<td rowspan="${span}">${list.map(r => `<div class="appt ${r.type === "위생" ? "hyg" : ""} ${hasTodo(r) ? "todo" : ""} ${tf(r) ? "" : "dim"}" data-act="meetPick" data-arg="${r.appt_id}" role="button" tabindex="0">
        <div class="label2"><b>${r.time}</b> ${esc(r.patient.name)}${r.new_patient ? ' <span class="tag t-brand">신환</span>' : ""}</div>
        <div class="caption1 fg3">${esc(r.procedure)} · ${r.duration}분</div>
        ${r.chips.alerts.length ? `<div class="caption1 neg">${r.chips.alerts.map(a => esc(a.label)).join(", ")}</div>` : ""}
        ${r.chips.balance > 0 ? `<div class="caption1 caut tnum">미수 ${won(r.chips.balance)}</div>` : ""}</div>`).join("")}</td>`;
    });
    body += "</tr>";
  });
  const todoRows = rowsAll.filter(tf).filter(hasTodo);
  return `<div class="row" style="margin-bottom:12px"><div class="seg">${[["all", "전체"], ["진료", "진료"], ["위생", "위생"]].map(([k, l]) => `<button class="${S.meetType === k ? "on" : ""}" data-act="meetType" data-arg="${k}">${l}</button>`).join("")}</div>
    <span class="caption1 fg3">아침 회의에서 오늘 전체를 봅니다 · 왼쪽 빨간 선 = 할 일 있는 환자 · 파란 바탕 = 위생</span></div>
  <div class="split" style="grid-template-columns:minmax(0,1fr) 340px">
    <div class="tbl-wrap"><table class="sched"><thead><tr><th>시간</th>${chairs.map(c => `<th>${c ? c + "번 체어" : "상담실"}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>
    <div class="stack">
      <section class="card"><h2 class="headline2" style="margin-bottom:12px">몰리는 시간대</h2>
        <div class="busy">${hk.map(h => `<div class="b"><span class="lb">${hours[h] || 0}</span><div class="bar ${hours[h] === maxH ? "peak" : ""}" style="height:${(hours[h] || 0) / maxH * 48}px"></div><span class="lb">${+h}시</span></div>`).join("")}</div>
        <p class="caption1 fg3" style="margin:8px 0 0">시작 시각 기준 예약 수 · ${S.meetType === "all" ? "전체" : S.meetType}</p></section>
      <section class="card"><div class="card-head"><h2 class="headline2">챙길 환자 ${todoRows.length}명</h2>${EX}</div>
        <ul class="list">${todoRows.map(r => `<li><span class="meta tnum">${r.time}</span><div class="main"><button class="item" data-act="emrOpen" data-arg="${r.patient.chart_no}"><div class="ttl label1">${esc(r.patient.name)} · ${esc(r.procedure)}</div></button><div class="caption1 fg2">${esc(suggest(r).short)}</div></div></li>`).join("")}</ul></section>
    </div></div>`;
}
function prepChair(rowsAll) {
  const chairs = [1, 2, 3, 4, 5, null];
  const key = c => c === null ? "상담" : c;
  const list = rowsAll.filter(r => key(r.chair) === S.chairSel).sort((a, b) => a.time < b.time ? -1 : 1);
  const isToday = S.prepDate === TODAY;
  const nextIdx = isToday ? list.findIndex(r => tmin(r.time) + r.duration > tmin(NOW)) : 0;
  const pick = list.find(r => r.appt_id === S.chairPick) || list[Math.max(0, nextIdx)];
  const nowLabel = r => !isToday ? "" : tmin(r.time) <= tmin(NOW) && tmin(NOW) < tmin(r.time) + r.duration ? "지금" : r === list[nextIdx] ? "다음" : "";
  return `<div class="row" style="margin-bottom:12px"><div class="seg">${chairs.map(c => `<button class="${S.chairSel === key(c) ? "on" : ""}" data-act="chairSel" data-arg="${key(c)}">${c ? c + "번" : "상담실"} ${rowsAll.filter(r => key(r.chair) === key(c)).length}</button>`).join("")}</div>
    <span class="caption1 fg3">진료 중 체어 옆 모니터 · "지금"은 ${isToday ? "오늘 " + NOW : "그날 첫 예약"} 기준, 시간이 되면 다음 환자로</span></div>
  ${list.length ? `<div class="split" style="grid-template-columns:320px minmax(0,1fr)">
    <div class="tbl-wrap"><ul class="chairlist">${list.map(r => `<li><button class="${pick === r ? "on" : ""}" data-act="chairPick" data-arg="${r.appt_id}">
      <span class="tnum"><b>${r.time}</b><br><span class="caption1 ${nowLabel(r) ? "brand" : "fg3"}">${nowLabel(r) || r.duration + "분"}</span></span>
      <span><span class="label1"><b>${esc(r.patient.name)}</b> · ${esc(r.procedure)}</span>${r.chips.alerts.length ? `<br><span class="caption1 neg">${r.chips.alerts.map(a => esc(a.label)).join(", ")}</span>` : ""}</span></button></li>`).join("")}</ul></div>
    ${chairCard(pick, nowLabel(pick))}
  </div>` : `<div class="card empty">이 체어에는 예약이 없습니다</div>`}`;
}
function chairCard(r, lbl) {

    <div class="row"><span class="tag ${lbl ? "t-brand" : ""}">${lbl ? lbl + " 환자" : "선택한 환자"}</span><span class="label1 fg3 tnum">${r.time} · ${r.duration}분 · ${esc(r.staff)}</span></div>

  if (S.followTop) rows = rows.filter(f => f.chips.length >= 4);
  if (S.followHideContacted) rows = rows.filter(f => !S.contacted[f.patient.chart_no]);
  const chipCls = c => c === "리콜 연체" ? "t-fam" : c.includes("스케일링") ? "t-ins" : c === "미수 잔액" ? "t-bal" : c.includes("노쇼") ? "t-neg" : "t-plan";
  return head("후속 관리", "예약 없이 놓친 환자를 칩별로 모으고 코드 점수로 줄 세웁니다. 예약이 잡히면 자동으로 빠집니다.", `<span class="updated">마지막 갱신 ${NOW} · 후보 ${all.length}명(칩 2개 이상)</span>`) + `
  <div class="row" style="margin-bottom:12px"><button class="fchip ${S.followChip === "all" ? "on" : ""}" data-act="followChip" data-arg="all">전체 <b>${all.length}</b></button>
    ${CH.map(c => `<button class="fchip ${S.followChip === c ? "on" : ""}" data-act="followChip" data-arg="${c}" ${c === "다른 치과 추정" ? 'title="타 기관 이력 데이터 생성 전"' : ""}>${c} <b>${all.filter(f => f.chips.includes(c)).length}</b></button>`).join("")}</div>
  <div class="row" style="margin-bottom:12px">
    <button class="fchip ${S.followTop ? "on" : ""}" data-act="followTop">1순위만 <b>${all.filter(f => f.chips.length >= 4).length}</b></button>
    <button class="fchip ${S.followHideContacted ? "on" : ""}" data-act="followHide">연락함 숨기기 <b>${Object.keys(S.contacted).length}</b></button>
    <span class="spacer"></span><button class="btn btn-ghost" data-act="howToggle" aria-expanded="${S.howOpen}">순위는 어떻게 정해지나요?</button></div>
  ${S.howOpen ? `<div class="card" style="margin-bottom:12px"><div class="row"><h2 class="headline2">순위 정하는 법</h2>${EX}<span class="caption1 fg3">규칙과 값은 앱 설정(ax_settings)에서 바꿈</span></div>
    <ul class="label1" style="margin:8px 0 0;padding-left:18px"><li>칩마다 점수: 리콜 연체 +25 · 올해 스케일링 급여 미사용 +20 · 진료계획 미예약 +20 · 노쇼 뒤 재예약 없음 +15 · 미수 잔액 +10</li><li>마지막 방문이 가까울수록 최대 +12 (6개월 넘으면 한 달마다 1점씩 깎임)</li><li>다른 치과 흔적(타 기관 이력·연락 무응답)이 있으면 −30</li><li>1순위 = 칩 4개 이상</li><li>점수는 코드가 계산하고 AI는 쓰지 않습니다</li></ul></div>` : ""}
  <div class="tbl-wrap"><table class="tbl"><thead><tr><th class="num">순위</th><th class="num">점수</th><th>환자</th><th>칩</th><th>마지막 내원</th><th>마지막 스케일링</th><th class="num">미수</th><th>연락</th></tr></thead><tbody>
  ${rows.map(f => `<tr><td class="num"><b>${f.rank}</b></td><td class="num">${f.score}</td>
    <td class="nowrap"><button class="link" data-act="emrOpen" data-arg="${f.patient.chart_no}">${esc(f.patient.name)}</button><div class="caption1 fg3 tnum">${f.patient.chart_no} · ${f.patient.age}세 · ${esc(f.patient.phone)}</div></td>
    <td><div class="tags">${f.chips.length >= 4 ? '<span class="tag t-brand">1순위</span>' : ""}${f.chips.map(c => `<span class="tag ${chipCls(c)}">${c}</span>`).join("")}</div></td>
    <td class="num">${f.last_visit || "-"}<div class="caption1 fg3">${f.last_visit ? Math.floor(dayDiff(f.last_visit, TODAY) / 30) + "개월 전" : ""}</div></td>
    <td class="num">${f.last_hygiene || "-"}</td><td class="num">${f.balance ? commas(f.balance) : "-"}</td>
    <td class="nowrap">${S.contacted[f.patient.chart_no] ? `<span class="tag t-pos">연락함 · ${esc(S.contacted[f.patient.chart_no])}</span>` : `<button class="btn btn-sm" data-act="contact" data-arg="${f.patient.chart_no}">연락함</button>`} <button class="btn btn-sm" disabled title="문자 초안(LLM, 선택) — 가장 급한 것 하나부터">문자 초안</button></td></tr>`).join("") || `<tr><td colspan="8" class="empty">조건에 맞는 환자가 없습니다${S.followChip === "다른 치과 추정" ? " — 다른 치과 추정은 타 기관 이력 데이터가 생기면 채워집니다" : ""}</td></tr>`}
  </tbody></table></div>`;
};

/* ───────── 동작 ───────── */
function go(s) { if (location.hash === "#" + s) render(); else location.hash = s; }
let tick = 0;
const stamp = () => nowPlus(++tick);
const A = {
  go: a => go(a),
  callsTab: a => { S.callsTab = a; render(); },
  callFilter: a => { S.callFilter = a; render(); },
  callSel: a => { S.callSel = a || null; render(); },
  openCall: a => { S.callsTab = "list"; S.callFilter = "all"; S.callQ = ""; S.callSel = a; go("calls"); },
  openFollow: () => { S.callsTab = "follow"; go("calls"); },
  done: a => { S.done[a] = { by: USER_NAME[S.user], at: stamp() }; render(); },
  undone: a => { delete S.done[a]; render(); },
  prepDate: a => { S.prepDate = a; S.prepOpen = null; S.chairPick = null; render(); },
  prepChip: a => { S.prepChip = a; render(); },
  prepType: a => { S.prepType = a; render(); },
  prepTodo: () => { S.prepTodoOnly = !S.prepTodoOnly; render(); },
  prepView: a => { S.prepView = a; render(); },
  prepOpen: a => { S.prepOpen = S.prepOpen === +a ? null : +a; render(); },
  openPrep: a => { S.prepDate = TODAY; S.prepView = "table"; S.prepChip = "all"; S.prepType = "all"; S.prepTodoOnly = false; S.prepOpen = +a; go("prep"); },
  openPrepChip: a => { S.prepDate = TODAY; S.prepView = "table"; S.prepChip = a; go("prep"); },
  regen: () => { S.prepRegen = 0; render(); const iv = setInterval(() => { S.prepRegen = Math.min(100, S.prepRegen + 12); if (S.prepRegen >= 100) { clearInterval(iv); S.prepRegen = null; S.prepUpdated = stamp(); } if (S.screen === "prep") render(); }, 180); },
  meetType: a => { S.meetType = a; render(); },
  meetPick: a => { const r = S.data.prep[S.prepDate].find(x => x.appt_id === +a); S.prepView = "chair"; S.chairSel = r.chair ?? "상담"; S.chairPick = r.appt_id; render(); },
  chairSel: a => { S.chairSel = a === "상담" ? "상담" : +a; S.chairPick = null; render(); },
  chairPick: a => { S.chairPick = +a; render(); },
  emrOpen: a => { if (S.emrChart !== a) S.emrMoves = 0; S.emrChart = a; S.emrQ = ""; S.emrTab = "기본정보"; go("emr"); },
  emrPick: a => { S.emrChart = a; S.emrTab = "기본정보"; S.emrMoves = 0; render(); },
  emrTab: a => { if (S.emrTab !== a) S.emrMoves++; S.emrTab = a; render(); },
  askTab: a => { S.askTab = a; render(); },
  askQ: a => { S.askTab = "chat"; ask(a); if (S.screen !== "ask") go("ask"); },
  searchWith: a => { S.searchQ = a; S.askTab = "search"; S.askInput = a; render(); },
  chatWith: a => { S.askTab = "chat"; ask(a); },
  docOpen: a => { S.docSel = +a; S.askTab = "docs"; go("ask"); },
  evalTab: a => { S.evalTab = a; render(); },
  jPick: a => { const [i, l] = a.split("|"); if (S.jSaved) return; const it = judgeItems()[+i]; S.jAns[it.key] = l; S.jActive = Math.min(+i + 1, judgeItems().length - 1); S.jBuf = ""; render(); },
  jSave: () => jSave(),
  jNext: () => jNext(),
  jSkip: () => { jNext(true); },
  bVote: a => { S.bRevealed = a; S.bVotes.push(a); render(); },
  bNext: () => { S.bRevealed = null; S.bIdx++; render(); },
  claimChip: a => { S.claimChip = a; S.claimOpen = null; render(); },
  claimOpen: a => { S.claimOpen = S.claimOpen === a ? null : a; render(); },
  claimJudge: a => { const [id, v] = a.split("|"); S.claimJudge[id] = v; render(); },
  finMonth: a => { S.finMonth = a; S.finOpen = null; render(); },
  finOpen: a => { S.finOpen = S.finOpen === a ? null : a; render(); },
  openRecon: a => { S.finMonth = a.slice(0, 7); S.finOpen = a; go("finance"); },
  finYes: a => { const [d, c] = a.split("|"); S.finConfirm[d] = c; render(); },
  followChip: a => { S.followChip = a; render(); },
  followTop: () => { S.followTop = !S.followTop; render(); },
  followHide: () => { S.followHideContacted = !S.followHideContacted; render(); },
  howToggle: () => { S.howOpen = !S.howOpen; render(); },
  contact: a => { S.contacted[a] = `${S.user} ${stamp()}`; render(); }
};
function ask(q) {
  q = q.trim(); if (!q) return;
  const ex = S.data.ask_examples.find(x => x.q === q) || S.data.ask_examples.find(x => tokens(q).length && tokens(q).filter(t => x.q.includes(t)).length >= Math.min(2, tokens(q).length));
  const item = ex ? { ...ex, q, pending:true } : { q, a:null, sources:[], refused:true, pending:true };
  S.chat.push(item); S.askInput = ""; render();
  setTimeout(() => { item.pending = false; if (S.screen === "ask") render(); }, 700);
}
function jSave() {
  const c = S.data.calls[S.jIdx % S.data.calls.length], items = judgeItems();
  const memo = $("#jMemo"); if (memo) S.jMemo = memo.value;
  S.jSaved = true;
  const model = {}; items.forEach(it => model[it.key] = modelLabel(c, it));
  S.judged.push({ uid: c.uid, ans: { ...S.jAns }, model, memo: S.jMemo });
  render();
}
function jNext(skip) { S.jIdx++; S.jAns = {}; S.jActive = 0; S.jBuf = ""; S.jSaved = false; S.jMemo = ""; render(); }

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act;
  // 행 안 링크·버튼이 먼저
  if (el.tagName === "TR" && e.target.closest("button,a,input,select") && e.target.closest("button,a,input,select") !== el) return;
  e.preventDefault();
  if (A[act]) A[act](el.dataset.arg ?? "", el);
});
document.addEventListener("keydown", e => {
  const el = e.target;
  if (e.key === "Enter" && el.dataset && el.dataset.act && el.getAttribute("role") === "button") { el.click(); return; }
  if (S.screen === "ask" && el.id === "askInput" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(el.value); return; }
  if (S.screen !== "eval") return;
  if (el.id === "jMemo") { if (e.key === "Enter") { e.preventDefault(); S.jMemo = el.value; el.blur(); S.jSaved ? jNext() : jSave(); } return; }
  if (/INPUT|TEXTAREA|SELECT/.test(el.tagName)) return;
  if (S.evalTab === "blind") {
    if (!S.bRevealed && /^[1-4]$/.test(e.key)) { A.bVote(e.key); e.preventDefault(); }
    else if (S.bRevealed && e.key === "Enter") { A.bNext(); e.preventDefault(); }
    return;
  }
  if (S.evalTab !== "judge") return;
  const items = judgeItems();
  if (e.key === "Enter") { e.preventDefault(); S.jSaved ? jNext() : jSave(); return; }
  if (S.jSaved) return;
  if (e.key === "/") { e.preventDefault(); const m = $("#jMemo"); if (m) m.focus(); return; }
  if (e.key === "ArrowDown") { e.preventDefault(); S.jActive = Math.min(S.jActive + 1, items.length - 1); S.jBuf = ""; render(); return; }
  if (e.key === "ArrowUp") { e.preventDefault(); S.jActive = Math.max(S.jActive - 1, 0); S.jBuf = ""; render(); return; }
  if (/^[0-9]$/.test(e.key)) {
    e.preventDefault();
    const it = items[S.jActive];
    const code = S.jBuf + e.key;
    if (code.length < it.digits) { S.jBuf = code; render(); return; }
    const o = it.opts.find(x => x.k === code);
    S.jBuf = "";
    if (o) { S.jAns[it.key] = o.l; S.jActive = Math.min(S.jActive + 1, items.length - 1); }
    render();
  }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "callQ") { S.callQ = el.value; const pos = el.selectionStart; render(); const n = $("#callQ"); n.focus(); n.setSelectionRange(pos, pos); }
  else if (el.id === "emrQ") { S.emrQ = el.value; const pos = el.selectionStart; render(); const n = $("#emrQ"); n.focus(); n.setSelectionRange(pos, pos); }
  else if (el.id === "askInput") S.askInput = el.value;
  else if (el.id === "jMemo") S.jMemo = el.value;
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.src) { S.srcTypes[el.dataset.src] = el.checked; render(); }
  else if (el.id === "sFrom") { S.sFrom = el.value; render(); }
  else if (el.id === "sTo") { S.sTo = el.value; render(); }
  else if (el.id === "sChart") { S.sChart = el.value.trim(); render(); }
  else if (el.dataset.fin) { if (el.value) S.finConfirm[el.dataset.fin] = el.value; render(); }
  else if (el.id === "userSel") { S.user = el.value; try { localStorage.setItem("ax-user", S.user); } catch (_) {} render(); }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "pasteForm") { const t = $("#pasteText").value, dir = e.target.querySelector("input[name=dir]:checked").value; S.pasteResult = { dir, len: t.length }; render(); }
  else if (e.target.id === "askForm") ask($("#askInput").value);
  else if (e.target.id === "searchForm") { S.searchQ = $("#searchQ").value; S.sChart = $("#sChart").value.trim(); render(); }
});
const SCREENS = ["today", "calls", "prep", "ask", "eval", "emr", "claims", "finance", "followup"];
function fromHash() { const h = location.hash.replace("#", ""); return SCREENS.includes(h) ? h : "today"; }
window.addEventListener("hashchange", () => { S.screen = fromHash(); if (S.data) { render(); window.scrollTo(0, 0); } });

try { const u = localStorage.getItem("ax-user"); if (u && USER_NAME[u]) S.user = u; } catch (_) {}
$("#userSel").value = S.user;
S.screen = fromHash();
document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.dataset.s === S.screen));
fetch("data.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(d => { S.data = d; render(); })
  .catch(() => { $("#main").innerHTML = `<div class="card empty" style="margin-top:24px"><h1 class="heading2">데이터를 불러오지 못했습니다</h1><p class="fg3">같은 폴더의 data.json을 읽지 못했습니다. 파일이 페이지 옆에 있는지 확인하고 새로 고쳐 주세요. 로컬 파일로 열었다면 간단한 웹 서버로 열어야 합니다.</p></div>`; });
</script>
