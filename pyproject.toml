[project]
name = "dental-clinic-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

# 의존성은 소속별 그룹으로 나눈다 — 생성기(generator/)와 앱(backend/)이 한 환경에 섞이지 않게
[dependency-groups]
generator = [
    "anthropic>=2.3.0",
    "faker",  # 버전이 이름 결정성에 영향 — uv.lock 커밋 필수
    "numpy",
    "pyyaml",
]
backend = [
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "numpy",
    "openai",
    "pydantic",
    "pyyaml",
    "sqlite-vec",
    "uvicorn>=0.54.0",
    "voyageai>=0.3.7",
]
dev = [
    "filelock>=4.2.6",
    "httpx>=0.28.1",
    "pytest",
    "pytest-xdist>=3.8.0",
    "ruff==0.16.10",
    "scikit-learn>=1.9.1",
]
finetune = [
    "mlx-lm>=0.32.2",
]

[tool.uv]
default-groups = ["generator", "backend", "dev"]  # uv sync·uv run 기본
python-preference = "only-managed"  # sqlite-vec은 SQLite 확장을 여는 파이썬이 필요하다 — python.org 빌드는 막혀 있다

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# 코드 컨벤션: PEP 8을 ruff로 (CLAUDE.md '코드 컨벤션'). 코드 줄은 PEP 8이 허용하는 최대 99자로 포매터가 맞추고,
# 한국어 독스트링·주석·긴 문자열은 줄 길이 검사(E501)에서 뺀다
[tool.ruff]
line-length = 99
# 다른 세션의 git worktree(.claude/worktrees/) — 그 브랜치의 작업 중 파일까지 검사하지 않게
extend-exclude = [".claude/worktrees"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "generator", "evaluation", "shared", "tests"]
