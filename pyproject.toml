[project]
name = "dental-clinic-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

# 의존성은 소속별 그룹으로 나눈다 — 생성기(generator/)와 앱(backend/, 착수 때 추가)이 한 환경에 섞이지 않게
[dependency-groups]
generator = [
    "anthropic>=2.3.0",
    "faker",  # 버전이 이름 결정성에 영향 — uv.lock 커밋 필수
    "numpy",
    "pyyaml",
]
dev = [
    "pytest",
    "ruff==0.16.10",
]

[tool.uv]
default-groups = ["generator", "dev"]  # uv sync·uv run 기본 — 앱 착수 때 backend 그룹 추가

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# 코드 컨벤션: PEP 8을 ruff로 (CLAUDE.md '코드 컨벤션'). 코드 줄은 PEP 8이 허용하는 최대 99자로 포매터가 맞추고,
# 한국어 독스트링·주석·긴 문자열은 줄 길이 검사(E501)에서 뺀다
[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["generator", "evaluation", "shared", "tests"]
